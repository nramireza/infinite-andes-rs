[workspace]
resolver = "2"
members = [
    "crates/andes-core",
    "crates/andes-app",
    "crates/andes-native",
    "crates/andes-web",
]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/nramireza/infinite-andes-rs"
description = "Paisaje procedural infinito de los Andes chilenos en pixel art (reescritura en Rust)."

[profile.release]
opt-level = 3
lto = "thin"
