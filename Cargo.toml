[workspace]
resolver = "2"
members = [
    "crates/andes-core",
    "crates/andes-app",
    "crates/andes-native",
    "crates/andes-web",
]

[workspace.package]
version = "0.6.7"
edition = "2021"
license = "MIT"
repository = "https://github.com/nramireza/infinite-andes-rs"
description = "Paisaje procedural infinito de los Andes chilenos en pixel art (reescritura en Rust)."

[profile.release]
opt-level = 3
lto = "thin"

# En dev el rasterizado (f64 por píxel) es el cuello de botella: compilar el
# núcleo optimizado y las dependencias también, para que `cargo run` sea fluido.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
